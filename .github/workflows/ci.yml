name: Corpus

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential pkg-config clang g++ wget cmake
      - name: Install radare2
        run: |
          git clone --depth 1 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh
      - name: Install r2morph runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install             "r2pipe>=1.9.0"             "capstone>=5.0.0"             "keystone-engine>=0.9.2"             "pydantic>=2.0.0"             "rich>=13.0.0"             "typer>=0.9.0"             "pyyaml>=6.0.0"             "pytest>=7.4.0"
          python -m pip install --no-deps             "git+https://github.com/seifreed/r2morph.git@main"
      - name: Validate scripts
        run: python -m compileall -q scripts
      - name: Build compiler matrix
        run: python scripts/build_corpus.py --output build
      - name: Require built samples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("build/manifest.json").read_text())
          built = [row for row in manifest["records"] if row["status"] == "built"]
          if not built:
              raise SystemExit("compiler matrix produced no samples")
          print(f"built samples: {len(built)}")
          PY
      - name: Transform and compare every built sample
        run: python scripts/run_matrix.py --build build --output results --seed 20260826
      - name: Validate full differential matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("build/manifest.json").read_text())
          report = json.loads(Path("results/matrix.json").read_text())
          built = sum(row["status"] == "built" for row in manifest["records"])
          if report["built_samples"] != built:
              raise SystemExit("matrix does not cover every built sample")
          if report["failed_samples"] != 0:
              raise SystemExit(f"differential failures: {report['failed_samples']}")
          if report["passed_samples"] != built:
              raise SystemExit("not every built sample passed")
          required_decompilers = {"ida_pro", "ghidra", "binary_ninja"}
          for record in report["records"]:
              if set(record["decompiler_effectiveness"]) != required_decompilers:
                  raise SystemExit("missing decompiler evidence fields")
          print(f"differential samples: {report['passed_samples']}")
          PY
