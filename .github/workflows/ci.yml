name: Corpus

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
    R2MORPH_REF: "a7249cf"

jobs:
  build-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential pkg-config clang g++ wget cmake
      - name: Install radare2
        run: |
          git clone --depth 1 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh
      - name: Install r2morph runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install             "r2pipe>=1.9.0"             "capstone>=5.0.0"             "keystone-engine>=0.9.2"             "pydantic>=2.0.0"             "rich>=13.0.0"             "typer>=0.9.0"             "pyyaml>=6.0.0"             "pytest>=7.4.0"
          python -m pip install --no-deps             "git+https://github.com/seifreed/r2morph.git@${R2MORPH_REF}"
      - name: Validate scripts
        run: python -m compileall -q scripts
      - name: Build compiler matrix
        run: python scripts/build_corpus.py --output build
      - name: Require built samples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("build/manifest.json").read_text())
          built = [row for row in manifest["records"] if row["status"] == "built"]
          if not built:
              raise SystemExit("compiler matrix produced no samples")
          print(f"built samples: {len(built)}")
          PY
      - name: Transform and compare every built sample and pass
        run: python scripts/run_matrix.py --build build --output results --seed 20260826 --workers 16 --report-only
      - name: Publish per-pass matrix summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("results/matrix.json")
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          if not report_path.exists():
              Path(summary_path).write_text("## Corpus matrix\n\nMatrix report was not produced.\n", encoding="utf-8")
          else:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              lines = [
                  "## Corpus matrix",
                  "",
                  f"Samples: {report['built_samples']}  |  Passed: {report['passed_samples']}  |  Failed: {report['failed_samples']}",
                  "",
                  "| Pass | Applied | Omitted | Errors | Differential passed | Differential failed |",
                  "| --- | ---: | ---: | ---: | ---: | ---: |",
              ]
              for name, values in sorted(report["pass_summary"].items()):
                  lines.append(
                      f"| {name} | {values['applied']} | {values['omitted']} | {values['errors']} | "
                      f"{values['differential_passed']} | {values['differential_failed']} |"
                  )
              Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Run static recovery benchmark
        run: python scripts/tool_benchmark.py --build build --matrix results/matrix.json --output results/tools.json --workers 8 --report-only
        if: always()
      - name: Validate full differential matrix
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("build/manifest.json").read_text())
          report = json.loads(Path("results/matrix.json").read_text())
          built = sum(row["status"] == "built" for row in manifest["records"])
          if report["built_samples"] != built:
              raise SystemExit("matrix does not cover every built sample")
          if report["failed_samples"] != 0:
              raise SystemExit(f"differential failures: {report['failed_samples']}")
          if report["passed_samples"] != built:
              raise SystemExit("not every built sample passed")
          required_passes = {
              "BlockReordering",
              "CodeVirtualization",
              "InstructionExpansion",
              "InstructionSubstitution",
              "NopInsertion",
              "RegisterSubstitution",
          }
          if set(report["passes"]) != required_passes:
              raise SystemExit("pass matrix is incomplete")
          if set(report["pass_summary"]) != required_passes:
              raise SystemExit("per-pass summary is incomplete")
          for pass_name, summary in report["pass_summary"].items():
              if summary["samples"] != built or summary["differential_failed"] != 0:
                  raise SystemExit(f"pass coverage failed: {pass_name}")
          required_decompilers = {"ida_pro", "ghidra", "binary_ninja"}
          for record in report["records"]:
              if set(record["decompiler_effectiveness"]) != required_decompilers:
                  raise SystemExit("missing decompiler evidence fields")
              for pass_name in required_passes:
                  pass_result = record.get("passes", {}).get(pass_name, {})
                  differential = pass_result.get("differential", {})
                  if differential.get("inputs") != [0, 7, 1, -11, -3, 64, 13, -64, 31]:
                      raise SystemExit(f"differential input set is incomplete: {pass_name}")
                  if len(differential.get("cases", [])) != 9:
                      raise SystemExit(f"differential case evidence is incomplete: {pass_name}")
          print(f"differential samples: {report['passed_samples']}")
      - name: Validate static recovery benchmark
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("results/matrix.json").read_text())
          benchmark = json.loads(Path("results/tools.json").read_text())
          if benchmark["status"] != "passed":
              raise SystemExit("static recovery benchmark did not pass")
          expected_measurements = sum(summary["samples"] for summary in report["pass_summary"].values())
          if benchmark["measured_samples"] != expected_measurements:
              raise SystemExit("static recovery benchmark does not cover every matrix sample and pass")
          for pass_name, summary in benchmark["pass_summary"].items():
              if summary["measured_samples"] + summary["failed_samples"] != summary["samples"]:
                  raise SystemExit(f"static recovery benchmark is incomplete: {pass_name}")
          required_omissions = {"ida_pro", "ghidra", "binary_ninja", "angr", "triton"}
          if set(benchmark["optional_runners"]) != required_omissions:
              raise SystemExit("optional runner evidence fields are incomplete")
          print(f"static recovery samples: {benchmark['measured_samples']}")
          PY
      - name: Validate malformed ELF corpus
        run: |
          sample=$(find build -type f -perm -u+x | sort | head -n 1)
          test -n "$sample"
          python scripts/malformed_corpus.py \
            --sample "$sample" \
            --output results/malformed.json
      - name: Upload corpus evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-evidence-${{ github.sha }}
          path: |
            build/manifest.json
            results/matrix.json
            results/tools.json
            results/malformed.json
          retention-days: 90
