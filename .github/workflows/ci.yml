name: Corpus

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential pkg-config clang g++ wget cmake
      - name: Install radare2
        run: |
          git clone --depth 1 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh
      - name: Install r2morph runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install             "r2pipe>=1.9.0"             "capstone>=5.0.0"             "keystone-engine>=0.9.2"             "pydantic>=2.0.0"             "rich>=13.0.0"             "typer>=0.9.0"             "pyyaml>=6.0.0"             "pytest>=7.4.0"
          python -m pip install --no-deps             "git+https://github.com/seifreed/r2morph.git@main"
      - name: Validate scripts
        run: python -m compileall -q scripts
      - name: Build compiler matrix
        run: python scripts/build_corpus.py --output build
      - name: Require built samples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("build/manifest.json").read_text())
          built = [row for row in manifest["records"] if row["status"] == "built"]
          if not built:
              raise SystemExit("compiler matrix produced no samples")
          print(f"built samples: {len(built)}")
          PY
      - name: Transform and compare every built sample
        run: python scripts/run_matrix.py --build build --output results --seed 20260826
      - name: Validate full differential matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("build/manifest.json").read_text())
          report = json.loads(Path("results/matrix.json").read_text())
          built = sum(row["status"] == "built" for row in manifest["records"])
          if report["built_samples"] != built:
              raise SystemExit("matrix does not cover every built sample")
          if report["failed_samples"] != 0:
              raise SystemExit(f"differential failures: {report['failed_samples']}")
          if report["passed_samples"] != built:
              raise SystemExit("not every built sample passed")
          required_decompilers = {"ida_pro", "ghidra", "binary_ninja"}
          for record in report["records"]:
              if set(record["decompiler_effectiveness"]) != required_decompilers:
                  raise SystemExit("missing decompiler evidence fields")
              differential = record.get("differential", {})
              if differential.get("inputs") != [4, 6, 8, -10, -9]:
                  raise SystemExit("differential input set is incomplete")
              if len(differential.get("cases", [])) != 5:
                  raise SystemExit("differential case evidence is incomplete")
          print(f"differential samples: {report['passed_samples']}")
      - name: Run static recovery benchmark
        run: python scripts/tool_benchmark.py --build build --matrix results/matrix.json --output results/tools.json
      - name: Validate static recovery benchmark
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("results/matrix.json").read_text())
          benchmark = json.loads(Path("results/tools.json").read_text())
          if benchmark["status"] != "passed":
              raise SystemExit("static recovery benchmark did not pass")
          if benchmark["measured_samples"] != report["passed_samples"]:
              raise SystemExit("static recovery benchmark does not cover every passed sample")
          required_omissions = {"ida_pro", "ghidra", "binary_ninja", "angr", "triton"}
          if set(benchmark["optional_runners"]) != required_omissions:
              raise SystemExit("optional runner evidence fields are incomplete")
          print(f"static recovery samples: {benchmark['measured_samples']}")
          PY
      - name: Validate malformed ELF corpus
        run: |
          sample=$(find build -type f -perm -u+x | sort | head -n 1)
          test -n "$sample"
          python scripts/malformed_corpus.py \
            --sample "$sample" \
            --output results/malformed.json
      - name: Upload corpus evidence
        uses: actions/upload-artifact@v4
        with:
          name: corpus-evidence-${{ github.sha }}
          path: |
            build/manifest.json
            results/matrix.json
            results/tools.json
            results/malformed.json
          retention-days: 90
